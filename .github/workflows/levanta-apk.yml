name: Gerar APK do Levanta!

on:
  push:
    paths:
      - 'despertador/**'
      - '.github/workflows/levanta-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: despertador
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Levanta.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Levanta-apk
          path: despertador/Levanta.apk

      - name: Publicar na página de Releases (link fixo para baixar no celular)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete levanta-latest --yes --cleanup-tag || true
          gh release create levanta-latest Levanta.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Levanta! – última versão" \
            --notes "Baixe o Levanta.apk no celular e instale (permita 'instalar apps desconhecidos'). Gerado do commit $GITHUB_SHA."
